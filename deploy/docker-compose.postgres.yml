# Optional Postgres for the backend. Not required — the default SQLite setup
# is intentional for zero-dependency demos. To use it:
#   docker compose -f deploy/docker-compose.postgres.yml up -d
#   pip install -r backend/requirements-postgres.txt
#   set DATABASE_URL=postgresql+asyncpg://screening:screening@127.0.0.1:5432/screening
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: screening
      POSTGRES_PASSWORD: screening
      POSTGRES_DB: screening
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - screening_pg:/var/lib/postgresql/data
volumes:
  screening_pg:
